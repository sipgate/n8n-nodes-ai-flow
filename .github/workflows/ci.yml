name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run test
        run: 'npm run test'

      - name: Run build
        run: 'npm run build'

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: 'npm ci'

      - name: Build package
        run: 'npm run build'

      - name: Initialize Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # No NPM_TOKEN needed: npm 11.5.1+ detects the OIDC trusted publisher
      # configured for this package on npmjs.com (Settings → Trusted Publisher)
      # and authenticates via the GitHub Actions OIDC token. Requires the
      # `id-token: write` permission set at the workflow level.
      - name: Publish to npm
        run: npm run release --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
